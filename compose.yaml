services:
  viral-shorts:
    build: .
    container_name: viral-shorts-studio
    restart: unless-stopped
    init: true
    stop_grace_period: 40s
    ports:
      - "127.0.0.1:3010:3010"
    env_file:
      - path: ../secrets/router.env
        required: false
      - path: ../secrets/providers.env
        required: false
    environment:
      PORT: "3010"
      DATA_DIR: /app/data
      SCENE_CONCURRENCY: ${SCENE_CONCURRENCY:-0}
      ROUTER_STATE_FILE: /app/data/provider-state.json
      AUTONOMOUS_MODE: ${AUTONOMOUS_MODE:-true}
      REQUIRE_APPROVAL_BEFORE_PUBLISH: ${REQUIRE_APPROVAL_BEFORE_PUBLISH:-true}
      OLLAMA_URL: ${OLLAMA_URL:-http://ollama:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen3:4b}
      OLLAMA_MODEL_FAST: ${OLLAMA_MODEL_FAST:-qwen3:1.7b}
      OLLAMA_ENABLED: ${OLLAMA_ENABLED:-true}
      OLLAMA_CLOUD_ENABLED: ${OLLAMA_CLOUD_ENABLED:-false}
      OLLAMA_CLOUD_MODEL: ${OLLAMA_CLOUD_MODEL:-gpt-oss:120b-cloud}
      HF_CLOUD_ENABLED: ${HF_CLOUD_ENABLED:-false}
      HF_TEXT_MODEL: ${HF_TEXT_MODEL:-openai/gpt-oss-120b}
      HF_FREE_DAILY_CALLS: ${HF_FREE_DAILY_CALLS:-2}
      TEXT_PROVIDER_ORDER: ${TEXT_PROVIDER_ORDER:-ollama,ollama-cloud,huggingface,openrouter,nvidia}
      NVIDIA_ENABLED: ${NVIDIA_ENABLED:-false}
      NVIDIA_MODEL: ${NVIDIA_MODEL:-nvidia/llama-3.1-nemotron-70b-instruct}
      AUTO_ENABLE_VERIFIED_FREE: ${AUTO_ENABLE_VERIFIED_FREE:-true}
      AUTO_CLOUD_ENHANCE: ${AUTO_CLOUD_ENHANCE:-true}
      WHITEBOARD_PYTHON: /opt/whiteboard/bin/python
      WHITEBOARD_ADAPTER: /app/python/whiteboard_scene.py
      PIPER_BIN: ${PIPER_BIN:-/opt/piper/bin/piper}
      PIPER_MODEL: ${PIPER_MODEL:-}
      PIPER_MODEL_EN: ${PIPER_MODEL_EN:-/opt/piper-voices/en_US-lessac-medium.onnx}
      PIPER_MODEL_FR: ${PIPER_MODEL_FR:-/opt/piper-voices/fr_FR-siwis-medium.onnx}
      PIPER_MODEL_ES: ${PIPER_MODEL_ES:-/opt/piper-voices/es_ES-sharvard-medium.onnx}
      PIPER_MODEL_IT: ${PIPER_MODEL_IT:-/opt/piper-voices/it_IT-serena-medium.onnx}
      PIPER_MODEL_DE: ${PIPER_MODEL_DE:-/opt/piper-voices/de_DE-thorsten-medium.onnx}
      PIPER_MODEL_RO: ${PIPER_MODEL_RO:-/opt/piper-voices/ro_RO-mihai-medium.onnx}
      TIKTOK_PUBLISH_ENABLED: ${TIKTOK_PUBLISH_ENABLED:-false}
      TIKTOK_ACCESS_TOKEN: ${TIKTOK_ACCESS_TOKEN:-}
      TIKTOK_DEFAULT_PRIVACY: ${TIKTOK_DEFAULT_PRIVACY:-SELF_ONLY}
      AUTO_EXECUTE_SCHEDULED_TIKTOK: ${AUTO_EXECUTE_SCHEDULED_TIKTOK:-false}
      PROVIDER_REGISTRY_FILE: /app/provider-registry.json
      PEXELS_KEY: ${PEXELS_KEY:-}
      PIXABAY_KEY: ${PIXABAY_KEY:-}
      FAL_KEY: ${FAL_KEY:-}
      PROVIDER_WORKER_TOKEN: ${PROVIDER_WORKER_TOKEN:-}
      APP_AUTH_SECRET: ${APP_AUTH_SECRET:-}
      PUBLIC_LAUNCH: ${PUBLIC_LAUNCH:-false}
      FORCE_SECURE_COOKIE: ${FORCE_SECURE_COOKIE:-false}
      WRITE_RATE_LIMIT: ${WRITE_RATE_LIMIT:-120}
      GOOGLE_OWNER_EMAILS: ${GOOGLE_OWNER_EMAILS:-}
      GOOGLE_OAUTH_REDIRECT_URI: ${GOOGLE_OAUTH_REDIRECT_URI:-}
      GOOGLE_LOGIN_ALLOW_ANY: ${GOOGLE_LOGIN_ALLOW_ANY:-false}
      YOUTUBE_PUBLISH_ENABLED: ${YOUTUBE_PUBLISH_ENABLED:-false}
      AUTO_EXECUTE_SCHEDULED_YOUTUBE: ${AUTO_EXECUTE_SCHEDULED_YOUTUBE:-false}
      YOUTUBE_ANALYTICS_ENABLED: ${YOUTUBE_ANALYTICS_ENABLED:-false}
      YOUTUBE_CATEGORY_ID: ${YOUTUBE_CATEGORY_ID:-22}
    depends_on:
      ollama:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ${PROVIDER_REGISTRY_HOST_PATH:-./provider-registry.json}:/app/provider-registry.json:ro
      - viral-shorts-data:/app/data
    mem_limit: 6g
    cpus: 4
    healthcheck:
      test: ["CMD","node","-e","fetch('http://127.0.0.1:3010/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
  provider-worker:
    build: .
    container_name: viral-shorts-provider-worker
    restart: unless-stopped
    init: true
    command: ["node","app/provider-worker.mjs"]
    env_file:
      - path: ../secrets/providers.env
        required: false
    environment:
      DATA_DIR: /app/data
      AUTO_ENABLE_VERIFIED_FREE: ${AUTO_ENABLE_VERIFIED_FREE:-true}
      STUDIO_INTERNAL_URL: http://viral-shorts:3010
      PROVIDER_WORKER_TOKEN: ${PROVIDER_WORKER_TOKEN:-}
      HF_GENERATION_ENABLED: ${HF_GENERATION_ENABLED:-false}
      HF_GENERATION_VERIFIED_FREE: ${HF_GENERATION_VERIFIED_FREE:-false}
      HF_IMAGE_MODEL: ${HF_IMAGE_MODEL:-black-forest-labs/FLUX.1-schnell}
      NVIDIA_GENERATION_ENABLED: ${NVIDIA_GENERATION_ENABLED:-false}
      NVIDIA_GENERATION_VERIFIED_FREE: ${NVIDIA_GENERATION_VERIFIED_FREE:-false}
      NVIDIA_IMAGE_ENDPOINT: ${NVIDIA_IMAGE_ENDPOINT:-}
      NVIDIA_IMAGE_MODEL: ${NVIDIA_IMAGE_MODEL:-}
      EXTERNAL_VIDEO_GENERATION_ENABLED: ${EXTERNAL_VIDEO_GENERATION_ENABLED:-false}
      EXTERNAL_VIDEO_GENERATION_VERIFIED_FREE: ${EXTERNAL_VIDEO_GENERATION_VERIFIED_FREE:-false}
      EXTERNAL_VIDEO_GENERATION_ENDPOINT: ${EXTERNAL_VIDEO_GENERATION_ENDPOINT:-}
      EXTERNAL_VIDEO_GENERATION_TOKEN: ${EXTERNAL_VIDEO_GENERATION_TOKEN:-}
      EXTERNAL_VIDEO_GENERATION_MODEL: ${EXTERNAL_VIDEO_GENERATION_MODEL:-}
    depends_on:
      viral-shorts:
        condition: service_healthy
    volumes:
      - viral-shorts-data:/app/data
    mem_limit: 1g
    cpus: 1

  ollama:
    image: ollama/ollama:latest
    container_name: viral-shorts-ollama
    restart: unless-stopped
    environment:
      OLLAMA_KEEP_ALIVE: 30m
      OLLAMA_NUM_PARALLEL: 1
    volumes:
      - ollama-data:/root/.ollama
    mem_limit: 8g
    cpus: 6
    healthcheck:
      test: ["CMD","ollama","list"]
      interval: 20s
      timeout: 5s
      retries: 5
volumes:
  viral-shorts-data:
  ollama-data:
