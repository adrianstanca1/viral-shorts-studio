name: Release Gate (VPS deployment retired)

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
  workflow_dispatch:

concurrency:
  group: viral-shorts-release-gate
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run release gate
        run: npm run release:check

  # VPS deployment is intentionally retired: no approved VPS/SSH target exists.
  # Keep this workflow as a release gate only until a VPS-free target is configured.
