name: Production Deploy

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
  workflow_dispatch:

concurrency:
  group: viral-shorts-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm ci
      - name: Run release gate
        run: npm run release:check

  deploy:
    needs: verify
    runs-on: ubuntu-latest
    environment: production
    env:
      VPS_HOST: 85.190.100.68
      VPS_USER: administrator
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
      VPS_PASSWORD: ${{ secrets.VPS_PASSWORD }}
    steps:
      - name: Validate deployment credential
        run: |
          set -euo pipefail
          if [[ -z "${VPS_SSH_KEY:-}" && -z "${VPS_PASSWORD:-}" ]]; then
            echo "::error::Set either VPS_SSH_KEY or VPS_PASSWORD in the production environment secrets."
            exit 1
          fi

      - name: Configure SSH
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          cat > ~/.ssh/known_hosts <<'EOF'
          85.190.100.68 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIAAOE0euHxCIKpRJj5CETbE0X+4j3uoUKFp4m8xhVRGY
          EOF
          chmod 600 ~/.ssh/known_hosts

          if [[ -n "${VPS_SSH_KEY:-}" ]]; then
            printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
            chmod 600 ~/.ssh/id_ed25519
          else
            sudo apt-get update -qq
            sudo apt-get install -y -qq sshpass
          fi

      - name: Deploy target stack with rollback
        shell: bash
        run: |
          set -euo pipefail

          if [[ -n "${VPS_SSH_KEY:-}" ]]; then
            ssh_cmd=(ssh -i ~/.ssh/id_ed25519)
          else
            export SSHPASS="$VPS_PASSWORD"
            ssh_cmd=(sshpass -e ssh)
          fi

          "${ssh_cmd[@]}" "${VPS_USER}@${VPS_HOST}" 'bash -s' <<'REMOTE'
          set -euo pipefail

          expected_origin='adrianstanca1/viral-shorts-studio'
          APP_DIR="$(
            find /home /opt /srv -maxdepth 4 -type d -name .git 2>/dev/null |
            while read -r gitdir; do
              repo="${gitdir%/.git}"
              [[ -f "$repo/compose.yaml" ]] || continue
              origin="$(git -C "$repo" remote get-url origin 2>/dev/null || true)"
              if [[ "$origin" == *"$expected_origin"* ]]; then
                printf '%s\n' "$repo"
                break
              fi
            done
          )"

          [[ -n "$APP_DIR" ]] || {
            echo "viral-shorts-studio checkout not found." >&2
            exit 1
          }

          cd "$APP_DIR"

          if [[ -n "$(git status --porcelain)" ]]; then
            echo "Production working tree is dirty; refusing deploy." >&2
            exit 1
          fi

          previous_sha="$(git rev-parse HEAD)"
          echo "Rollback point: $previous_sha"

          git fetch origin main
          git checkout main
          git pull --ff-only origin main

          node hermes/validate.mjs
          node hermes/policy-test.mjs
          docker compose config -q

          rollback() {
            echo "Deployment health failed; rolling back to $previous_sha" >&2
            git reset --hard "$previous_sha"
            docker compose build viral-shorts provider-worker
            docker compose up -d --no-deps viral-shorts provider-worker
          }

          trap rollback ERR

          docker compose build viral-shorts provider-worker
          docker compose up -d --no-deps viral-shorts provider-worker

          for attempt in {1..18}; do
            app_health="$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' viral-shorts-studio 2>/dev/null || true)"
            worker_health="$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' viral-shorts-provider-worker 2>/dev/null || true)"
            echo "health attempt $attempt: app=$app_health worker=$worker_health"
            if [[ "$app_health" == "healthy" && "$worker_health" == "healthy" ]]; then
              trap - ERR
              echo "Production deployment healthy."
              exit 0
            fi
            sleep 10
          done

          echo "Target services did not become healthy in time." >&2
          false
          REMOTE
