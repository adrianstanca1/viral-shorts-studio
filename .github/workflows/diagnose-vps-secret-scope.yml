name: Diagnose VPS Secret Scope
on:
  push:
    branches: [diagnose-vps-secret-scope]
permissions:
  contents: read
jobs:
  repo-scope:
    runs-on: ubuntu-latest
    steps:
      - name: Check secret presence
        env:
          A: ${{ secrets.VPS_PASSWORD }}
          B: ${{ secrets.VPS_SSH_KEY }}
          C: ${{ secrets.SSH_PASSWORD }}
          D: ${{ secrets.SERVER_PASSWORD }}
          E: ${{ secrets.ONECOM_PASSWORD }}
          F: ${{ secrets.ONE_COM_PASSWORD }}
        run: |
          set -euo pipefail
          for n in A B C D E F; do
            if [[ -n "${!n:-}" ]]; then echo "$n=present"; else echo "$n=missing"; fi
          done
  production-scope:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Check secret presence
        env:
          A: ${{ secrets.VPS_PASSWORD }}
          B: ${{ secrets.VPS_SSH_KEY }}
          C: ${{ secrets.SSH_PASSWORD }}
          D: ${{ secrets.SERVER_PASSWORD }}
          E: ${{ secrets.ONECOM_PASSWORD }}
          F: ${{ secrets.ONE_COM_PASSWORD }}
        run: |
          set -euo pipefail
          for n in A B C D E F; do
            if [[ -n "${!n:-}" ]]; then echo "$n=present"; else echo "$n=missing"; fi
          done
