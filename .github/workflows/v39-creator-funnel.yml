name: V39 Creator Funnel
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/v39-creator-funnel.yml'
permissions:
  contents: write
jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply V39 creator funnel
        shell: python
        run: |
          from pathlib import Path
          ui=Path('app/public/index.html')
          s=ui.read_text()
          css=".creator-funnel{display:grid;gap:10px;padding:12px;border:1px solid var(--line);border-radius:14px;background:#fbfaff;margin:0 0 12px}.creator-flow{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}.creator-flow span{font-size:11px;font-weight:900;text-align:center;padding:7px 5px;border-radius:999px;background:#fff;border:1px solid var(--line);color:var(--muted)}.creator-flow span.on{background:var(--soft);color:#5145cd;border-color:#d8d2ff}.creator-presets{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.creator-presets button{margin:0;background:#fff;color:var(--ink);border-color:var(--line);padding:10px}.creator-presets button.on{background:var(--accent);color:#fff;border-color:var(--accent)}.creator-preset-copy{font-size:12px;color:var(--muted)}"
          marker='@media(max-width:950px){'
          assert marker in s
          s=s.replace(marker,css+marker,1)
          wizard='<div class="wizard">'
          assert wizard in s
          funnel='''<div class="creator-funnel"><div class="creator-flow"><span class="on">1 Idea</span><span>2 Format</span><span>3 Style</span><span>4 Generate</span><span>5 Review</span></div><div class="creator-presets"><button type="button" data-creator-preset="short" onclick="applyCreatorPreset(\'short\')">Short · 60s</button><button type="button" data-creator-preset="long" onclick="applyCreatorPreset(\'long\')">Long · 10m</button><button type="button" data-creator-preset="whiteboard" onclick="applyCreatorPreset(\'whiteboard\')">Whiteboard · 90s</button></div><div id="creatorPresetCopy" class="creator-preset-copy">Choose a starting format, then enter your idea. Advanced options stay available below.</div></div>'''
          s=s.replace(wizard,funnel+wizard,1)
          marker2='async function createProject(){'
          assert marker2 in s
          helper="""const creatorPresetConfig={short:{duration:60,mode:'multi-scene',style:'documentary',aspect:'9:16',copy:'Fast vertical short with documentary pacing.'},long:{duration:600,mode:'multi-scene',style:'cinematic',aspect:'16:9',copy:'Long-form cinematic video with deeper research and structure.'},whiteboard:{duration:90,mode:'whiteboard',style:'whiteboard',aspect:'16:9',copy:'Explainer-style whiteboard video with concise visual storytelling.'}};\nfunction applyCreatorPreset(name){const cfg=creatorPresetConfig[name];if(!cfg)return;for(const [id,value] of Object.entries({duration:cfg.duration,mode:cfg.mode,style:cfg.style,aspect:cfg.aspect})){const el=document.getElementById(id);if(el)el.value=String(value)}document.querySelectorAll('[data-creator-preset]').forEach(el=>el.classList.toggle('on',el.dataset.creatorPreset===name));const copy=document.getElementById('creatorPresetCopy');if(copy)copy.textContent=cfg.copy;try{localStorage.setItem('creatorPreset',name)}catch{}}\nfunction restoreCreatorPreset(){let name='short';try{name=localStorage.getItem('creatorPreset')||'short'}catch{};applyCreatorPreset(creatorPresetConfig[name]?name:'short')}\nsetTimeout(restoreCreatorPreset,0);\n"""
          s=s.replace(marker2,helper+marker2,1)
          ui.write_text(s)

          plan=Path('V39_DEVELOPMENT_PLAN.md')
          plan.write_text('''# Creator OS V39 Development Plan\n\n## V39.1 Task-first creator funnel\n- [x] Add Idea → Format → Style → Generate → Review visual flow.\n- [x] Preserve the existing project API and all advanced controls.\n\n## V39.2 Quick-start formats\n- [x] Add Short 60s, Long 10m and Whiteboard 90s presets.\n- [x] Map presets to existing duration, mode, style and aspect fields rather than creating parallel backend logic.\n\n## V39.3 Mobile usability\n- [x] Persist the last selected preset locally.\n- [x] Keep the funnel compact and touch friendly.\n\n## V39.4 Safety and compatibility\n- [x] Preserve free/local-first provider routing and approval-gated publishing.\n- [x] Do not change external publishing authorization behavior.\n\n## V39.5 Release assurance\n- [x] Extend competitive regression checks for the creator funnel.\n- [x] Run the full release gate before committing.\n''')
          cc=Path('scripts/competitive-check.mjs')
          c=cc.read_text()
          decl="v38=read('V38_DEVELOPMENT_PLAN.md'),ui="
          assert decl in c
          c=c.replace(decl,"v38=read('V38_DEVELOPMENT_PLAN.md'),v39=read('V39_DEVELOPMENT_PLAN.md'),ui=",1)
          tail="  ['V38 tracked work complete',!/^\\s*- \\[ \\]/m.test(v38)]\n];"
          assert tail in c
          c=c.replace(tail,"  ['V38 tracked work complete',!/^\\s*- \\[ \\]/m.test(v38)],\n  ['task-first creator funnel',ui.includes('creator-funnel')&&ui.includes('creatorPresetConfig')&&ui.includes('applyCreatorPreset')],\n  ['creator quick-start presets',ui.includes('Short · 60s')&&ui.includes('Long · 10m')&&ui.includes('Whiteboard · 90s')],\n  ['V39 tracked work complete',!/^\\s*- \\[ \\]/m.test(v39)]\n];",1)
          cc.write_text(c)
      - name: Install
        run: npm ci
      - name: Validate
        run: npm run release:check
      - name: Commit V39 to branch
        run: |
          git config user.name 'adrian stanca'
          git config user.email '192421473+adrianstanca1@users.noreply.github.com'
          git rm .github/workflows/v39-creator-funnel.yml
          git add app/public/index.html scripts/competitive-check.mjs V39_DEVELOPMENT_PLAN.md
          git commit -m 'Add V39 task-first creator funnel'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
