<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Viral Shorts Studio</title>
<style>
:root{font-family:Inter,system-ui,sans-serif;background:#0b0d12;color:#f6f7fb}body{margin:0}.wrap{max-width:1180px;margin:auto;padding:24px}.top{display:flex;justify-content:space-between;align-items:center;gap:16px}.brand{font-weight:800;font-size:24px}.pill{background:#171b24;border:1px solid #2a3140;padding:7px 11px;border-radius:999px}.grid{display:grid;grid-template-columns:360px 1fr;gap:20px;margin-top:22px}.card{background:#11151d;border:1px solid #232a38;border-radius:16px;padding:18px}input,select,button{width:100%;box-sizing:border-box;border-radius:10px;border:1px solid #31394b;background:#0d1118;color:#fff;padding:12px;margin:7px 0}button{background:#fff;color:#111;font-weight:750;cursor:pointer}.secondary{background:#1a2130;color:#fff}.project{padding:12px;border:1px solid #252d3d;border-radius:12px;margin:9px 0;cursor:pointer}.muted{color:#9aa5b5;font-size:13px}.bar{height:8px;background:#252b36;border-radius:8px;overflow:hidden}.bar i{display:block;height:100%;background:#fff}.scenes{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.scene{border:1px solid #2b3241;border-radius:14px;padding:12px}.scene video{width:100%;aspect-ratio:9/16;max-height:320px;background:#000;border-radius:10px}.score{font-size:34px;font-weight:900}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.stat{background:#0d1118;border-radius:12px;padding:12px}.stat b{display:block;font-size:22px}@media(max-width:850px){.grid{grid-template-columns:1fr}.scenes{grid-template-columns:1fr}.stats{grid-template-columns:repeat(2,1fr)}}
</style></head><body><div class="wrap"><div class="top"><div><div class="brand">⚡ Viral Shorts Studio</div><div class="muted">Autonomous research → storyboard → multi-scene video production</div></div><div class="pill" id="health">Checking…</div></div>
<div class="grid"><div><div class="card"><h3>Create short</h3><input id="topic" placeholder="Topic, case, historical event or claim"><select id="niche"><option value="history">History</option><option value="true-crime">True crime</option><option value="storytelling">Storytelling</option><option value="fact-check">Fact check</option></select><select id="duration"><option>30</option><option>45</option><option>60</option><option>90</option></select><button onclick="createProject()">Generate autonomously</button></div><div class="card" style="margin-top:14px"><h3>Projects</h3><div id="projects"></div></div></div>
<div><div class="card"><h3>Production metrics</h3><div class="stats" id="stats"></div></div><div class="card" style="margin-top:14px" id="detail"><div class="muted">Select a project to inspect scenes, preview the final video, or regenerate one scene.</div></div></div></div></div>
<script>
let selected=null; const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
async function api(url,opt){const r=await fetch(url,opt);if(!r.ok)throw new Error(await r.text());return r.json()}
async function refresh(){try{const h=await api('/api/health');health.textContent='● '+h.status;health.style.color='#85f5a3'}catch{health.textContent='● offline'}
const [ps,st]=await Promise.all([api('/api/projects'),api('/api/stats')]);projects.innerHTML=ps.slice(0,20).map(p=>`<div class="project" onclick="show('${p.id}')"><b>${esc(p.topic)}</b><div class="muted">${p.niche} · ${p.duration}s · ${p.status}</div><div class="bar"><i style="width:${p.progress||0}%"></i></div></div>`).join('');stats.innerHTML=[['Projects',st.projects],['Success',st.successRate+'%'],['Avg build',st.averageProductionSeconds+'s'],['Avg score',st.averageViralityScore]].map(x=>`<div class="stat"><span class="muted">${x[0]}</span><b>${x[1]}</b></div>`).join('');if(selected)show(selected,false)}
async function createProject(){const topic=document.querySelector('#topic').value.trim();if(!topic)return alert('Enter a topic');const p=await api('/api/projects',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({topic,niche:document.querySelector('#niche').value,duration:Number(document.querySelector('#duration').value)})});selected=p.id;await refresh()}
async function show(id,set=true){if(set)selected=id;const p=await api('/api/projects/'+id);let html=`<h2>${esc(p.topic)}</h2><div class="muted">${p.niche} · ${p.status} · ${p.progress||0}%</div>`;if(p.render?.file)html+=`<video controls style="width:100%;max-height:500px;background:#000;border-radius:12px;margin:12px 0" src="/api/projects/${id}/video"></video>`;if(p.qa)html+=`<div><span class="score">${p.qa.viralityScore}</span><span class="muted"> /100 quality/virality</span></div>`;if(p.metrics)html+=`<div class="muted">Research ${p.metrics.researchSeconds}s · Media ${p.metrics.mediaDiscoverySeconds}s · Scenes ${p.metrics.sceneRenderSeconds}s · Total ${p.metrics.totalSeconds}s</div>`;if(p.publish)html+=`<p><b>${esc(p.publish.title)}</b><br><span class="muted">${esc(p.publish.description)}</span></p>`;if(p.scenes?.length){html+=`<h3>Scenes</h3><div class="scenes">`+p.scenes.sort((a,b)=>a.index-b.index).map(s=>`<div class="scene"><b>Scene ${s.index}</b><div class="muted">${s.duration}s · ${s.assets?.length||0} assets ${s.hasRealVideo?'· real video':''}</div><video controls preload="metadata" src="/api/projects/${id}/scenes/${s.index}/video"></video><p>${esc(s.narration)}</p><button class="secondary" onclick="regen('${id}',${s.index})">Regenerate this scene</button></div>`).join('')+`</div>`}detail.innerHTML=html}
async function regen(id,index){if(!confirm('Generate a new variant for scene '+index+'? Other completed scenes will be reused.'))return;await api(`/api/projects/${id}/scenes/${index}/regenerate`,{method:'POST'});selected=id;refresh()}
refresh();setInterval(refresh,4000);
</script></body></html>
