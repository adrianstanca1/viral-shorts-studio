<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Viral Shorts Studio</title>
<style>
:root{font-family:Inter,system-ui,sans-serif;background:#0b0d12;color:#f6f7fb}body{margin:0}.wrap{max-width:1180px;margin:auto;padding:24px}.top{display:flex;justify-content:space-between;align-items:center;gap:16px}.brand{font-weight:800;font-size:24px}.pill{background:#171b24;border:1px solid #2a3140;padding:7px 11px;border-radius:999px}.grid{display:grid;grid-template-columns:360px 1fr;gap:20px;margin-top:22px}.card{background:#11151d;border:1px solid #232a38;border-radius:16px;padding:18px}input,select,button{width:100%;box-sizing:border-box;border-radius:10px;border:1px solid #31394b;background:#0d1118;color:#fff;padding:12px;margin:7px 0}button{background:#fff;color:#111;font-weight:750;cursor:pointer}.secondary{background:#1a2130;color:#fff}.project{padding:12px;border:1px solid #252d3d;border-radius:12px;margin:9px 0;cursor:pointer}.muted{color:#9aa5b5;font-size:13px}.bar{height:8px;background:#252b36;border-radius:8px;overflow:hidden}.bar i{display:block;height:100%;background:#fff}.scenes{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.scene{border:1px solid #2b3241;border-radius:14px;padding:12px}.scene video{width:100%;aspect-ratio:9/16;max-height:320px;background:#000;border-radius:10px}.variants{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:8px}.variant{background:#0d1118;border:1px solid #283044;border-radius:10px;padding:8px}.variant video{max-height:180px}.variant button{padding:8px;font-size:12px}.score{font-size:34px;font-weight:900}.actions{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}.actions a,.actions button{width:auto;display:inline-block;padding:9px 12px;margin:0;text-decoration:none;border-radius:9px}.actions a{background:#1a2130;color:#fff;border:1px solid #31394b;font-weight:700}.danger{background:#5b1d25!important;color:#fff!important;border-color:#7d2934!important}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.stat{background:#0d1118;border-radius:12px;padding:12px}.stat b{display:block;font-size:22px}@media(max-width:850px){.grid{grid-template-columns:1fr}.scenes{grid-template-columns:1fr}.stats{grid-template-columns:repeat(2,1fr)}}
</style></head><body><div class="wrap"><div class="top"><div><div class="brand">⚡ Viral Shorts Studio</div><div class="muted">Autonomous research → storyboard → multi-scene video production</div></div><div class="pill" id="health">Checking…</div></div>
<div class="grid"><div><div class="card"><h3>Create short</h3><input id="topic" placeholder="Topic, case, historical event or claim"><select id="niche"><option value="history">History</option><option value="true-crime">True crime</option><option value="storytelling">Storytelling</option><option value="fact-check">Fact check</option></select><select id="style"><option value="documentary">Documentary</option><option value="cinematic">Cinematic</option><option value="hybrid">Hybrid auto-direct</option><option value="whiteboard">Whiteboard animation</option></select><select id="duration"><option value="30">30 seconds</option><option value="60">1 minute</option><option value="90">1 minute 30 seconds</option></select><button onclick="createProject()">Generate autonomously</button></div><div class="card" style="margin-top:14px"><h3>Projects</h3><select id="projectFilter" onchange="refresh()"><option value="all">All projects</option><option value="review">Needs review</option><option value="launch-ready">Launch-ready pending</option><option value="approved">Approved</option><option value="failed">Failed</option></select><div id="projects"></div></div></div>
<div><div class="card"><h3>Production metrics</h3><div class="stats" id="stats"></div></div><div class="card" style="margin-top:14px" id="detail"><div class="muted">Select a project to inspect scenes, preview the final video, or regenerate one scene.</div></div></div></div></div>
<script>
let selected=null; const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
async function api(url,opt){const r=await fetch(url,opt);if(!r.ok)throw new Error(await r.text());return r.json()}
async function refresh(){try{const dash=await api('/api/dashboard'),ps=dash.projects||[],st=dash.stats||{},pj=dash.providerJobs||{},pv=dash.providerVerification||{},dg=dash.diagnostics||{},filter=document.querySelector('#projectFilter')?.value||'all';const visible=ps.filter(p=>filter==='all'||(filter==='review'&&p.status==='complete'&&p.publishApproval?.status!=='approved')||(filter==='launch-ready'&&p.launchReady&&p.publishApproval?.status==='pending')||(filter==='approved'&&p.publishApproval?.status==='approved')||(filter==='failed'&&p.status==='failed'));health.textContent='● '+(dg.status||'ready');health.style.color=dg.status==='ready'?'#85f5a3':'#ffd479';projects.innerHTML=visible.slice(0,30).map(p=>`<div class="project" onclick="show('${p.id}')"><b>${esc(p.topic)}</b><div class="muted">${p.niche} · ${p.style||'documentary'} · ${p.duration}s · ${p.status}${p.launchReady?' · launch-ready':''}${p.publishApproval?.status?' · '+esc(p.publishApproval.status):''}</div><div class="bar"><i style="width:${p.progress||0}%"></i></div></div>`).join('')||'<div class="muted">No projects in this view.</div>';const q=(pj.counts?.pending||0)+(pj.counts?.leased||0),free=(pv.worker||[]).filter(x=>x.verifiedFree).reduce((n,x)=>n+Number(x.remaining||0),0);stats.innerHTML=[['Projects',st.projects],['AI queue',q],['Pending review',st.pendingApproval||0],['Approved',st.approved||0],['Free AI',free],['Launch',dg.status==='ready'?'READY':'CHECK']].map(x=>`<div class="stat"><span class="muted">${x[0]}</span><b>${x[1]}</b></div>`).join('');const failed=(dg.checks||[]).filter(x=>!x.ok);const recentFailures=dg.recentProjectFailures||[];health.title=[...(dg.checks||[]).map(x=>`${x.label}: ${x.detail}`),recentFailures.length?`Recent failed projects: ${recentFailures.length}`:''].filter(Boolean).join(' | ');if(failed.length){health.textContent='● '+dg.status+' · '+failed.map(x=>x.label).join(', ');health.style.color='#ffd479'}if(selected)show(selected,false)}catch{health.textContent='● offline';health.style.color='#ff8f8f'}}
async function createProject(){const topic=document.querySelector('#topic').value.trim();if(!topic)return alert('Enter a topic');const p=await api('/api/projects',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({topic,niche:document.querySelector('#niche').value,style:document.querySelector('#style').value,duration:Number(document.querySelector('#duration').value)})});selected=p.id;await refresh()}
async function show(id,set=true){if(set)selected=id;const p=await api('/api/projects/'+id);let html=`<h2>${esc(p.topic)}</h2><div class="muted">${p.niche} · ${p.style||'documentary'} · ${p.status} · ${p.progress||0}%</div>`;if(p.render?.file){const approved=p.publishApproval?.status==='approved'&&p.qa?.launchReady===true;html+=`<video controls style="width:100%;max-height:500px;background:#000;border-radius:12px;margin:12px 0" src="/api/projects/${id}/video"></video><div class="actions"><a href="/api/projects/${id}/video?download=1">Download MP4</a><a href="/api/projects/${id}/credits?download=1">Credits JSON</a><a href="/api/projects/${id}/export">Project export</a>${approved?`<a href="/api/projects/${id}/publish-manifest">Publish manifest</a>`:''}</div>`;}if(p.status==='failed'){const rc=p.recoverability||{};html+=`<div class="card" style="margin-top:12px;border-color:#7d2934"><b>Generation failed${p.failedStage?' during '+esc(p.failedStage):''}</b><div class="muted" style="margin-top:6px">${esc(p.error||'Unknown generation error')}</div>${p.failedAt?`<div class="muted">Failed ${esc(p.failedAt)} · retries ${Number(p.retryCount||0)}</div>`:''}${rc.reason?`<div class="muted">Recovery: ${rc.recoverable?'recoverable':'manual review'} · ${esc(rc.confidence||'')} · ${esc(rc.reason)}</div>`:''}</div>${rc.recoverable!==false?`<div class="actions"><button class="secondary" onclick="retryProject('${id}')">Retry recoverable project</button></div>`:''}`;}if(['complete','failed'].includes(p.status))html+=`<div class="actions"><button class="danger" onclick="deleteProject('${id}')">Delete project</button></div>`;if(p.qa)html+=`<div><span class="score">${p.qa.viralityScore}</span><span class="muted"> /100 quality/virality · ${p.qa.launchReady?'launch-ready':'needs review'}${p.qa.retention?` · retention ${p.qa.retention.score}/100${p.qa.retention.highRiskScenes?.length?` · risk scenes ${p.qa.retention.highRiskScenes.join(',')}`:''}`:''}${p.qa.averageVisualScore!=null?` · visual ${p.qa.averageVisualScore}/100${p.qa.weakVisualScenes?.length?` · weak visual ${p.qa.weakVisualScenes.join(',')}`:''}`:''}${p.qa.editingRhythm?` · edit ${p.qa.editingRhythm.score}/100${p.qa.editingRhythm.adjacentRepeats?.length?` · repeats ${p.qa.editingRhythm.adjacentRepeats.length}`:''}`:''}${p.qa.media?` · ${p.qa.media.width}×${p.qa.media.height} · ${esc(p.qa.media.videoCodec||'video')}/${esc(p.qa.media.audioCodec||'audio')}`:''}</span></div><div class="muted">Content quality ${p.qa.contentQualityPercent??'—'}% · narration ${p.qa.averageNarrationScore??'—'}/100 · retention ${p.qa.retention?.score??'—'}/100 · accepted ${p.qa.acceptedScenes??'—'}/${p.qa.sceneCount??'—'} scenes${p.qa.narrationRepair?.count?' · narration repaired: '+p.qa.narrationRepair.scenes.map(x=>x.index).join(', '):''}${p.qa.weakNarrationScenes?.length?' · narration review: '+p.qa.weakNarrationScenes.join(', '):''}${p.qa.retention?.highRiskScenes?.length?' · retention review: '+p.qa.retention.highRiskScenes.join(', '):''}${p.qa.editingRhythm?` · editing ${p.qa.editingRhythm.score}/100 · longest run ${p.qa.editingRhythm.longestVisualRun}`:''}</div>`;if(p.metrics)html+=`<div class="muted">Research ${p.metrics.researchSeconds??'—'}s · Storyboard ${p.metrics.storyboardSeconds??'—'}s · Media ${p.metrics.mediaDiscoverySeconds??'—'}s · Scenes ${p.metrics.sceneRenderSeconds??'—'}s · Total ${p.metrics.totalSeconds??'—'}s</div>`;if(p.publish)html+=`<p><b>${esc(p.publish.title)}</b><br><span class="muted">${esc(p.publish.description)}</span></p>`;if(p.status==='complete'){const ap=p.publishApproval||{status:'pending'};html+=`<div class="pill" style="display:inline-block;margin:8px 0">Publish review: ${esc(ap.status||'pending')}${ap.note?' · '+esc(ap.note):''}</div>`;if(ap.status!=='approved')html+=`<div class="actions"><button onclick="approveProject('${id}')">Approve for publishing</button><button class="secondary" onclick="rejectProject('${id}')">Reject / request changes</button></div>`;}if(p.generativeQueue)html+=`<div class="pill" style="display:inline-block;margin:8px 0">AI generation: ${esc(p.generativeQueue.status?.mode||'plan-only')} · ${p.generativeQueue.requestCount||0} scene requests · ${p.generativeQueue.status?.eligibleImageToVideo?.length||0} direct providers</div>`;if(p.aiGenerationPlan)html+=`<div class="pill" style="display:inline-block;margin:8px 0 8px 8px">Cloud AI plan: ${p.aiGenerationPlan.selected?.length||0}/${p.aiGenerationPlan.allowance||0} scenes · ${esc(p.aiGenerationPlan.provider||'provider')} · free only</div>`;if(p.scenes?.length){html+=`<h3>Scenes</h3><div class="scenes">`+p.scenes.sort((a,b)=>a.index-b.index).map(s=>{const vs=p.sceneVariants?.[String(s.index)]||[];const variants=vs.length?`<div class="muted" style="margin-top:8px">Saved variants: ${vs.length}</div><div class="variants">${vs.slice(-4).reverse().map((v,i)=>`<div class="variant"><div class="muted">Variant ${v.variantSeed??vs.length-i} · ${v.visualType||'visual'}${v.aiProvider?' · AI '+esc(v.aiProvider):''} · score ${v.candidateScore??'—'}${v.autoGenerated?' · auto':''}</div><video controls preload="none" src="/api/projects/${id}/scenes/${s.index}/variants/${v.id}/video"></video><button onclick="useVariant('${id}',${s.index},'${v.id}')">Use this variant</button></div>`).join('')}</div>`:'';return `<div class="scene"><b>Scene ${s.index}</b><div class="muted">${s.duration}s · ${s.assets?.length||0} assets ${s.hasRealVideo?'· real video':''}${s.visualType?' · '+esc(s.visualType):''}${s.aiProvider?' · AI '+esc(s.aiProvider):''}${s.candidateScore!=null?' · score '+s.candidateScore:''}${s.qualityGate?' · gate '+(s.qualityGate.accepted?'pass':'retry'):''}${s.variantId?' · auto-selected':''}</div><video controls preload="metadata" src="/api/projects/${id}/scenes/${s.index}/video"></video><p>${esc(s.narration)}</p><button class="secondary" onclick="regen('${id}',${s.index})">Generate another variant</button>${variants}</div>`}).join('')+`</div>`}detail.innerHTML=html}
async function regen(id,index){if(!confirm('Generate a new variant for scene '+index+'? The current version will be saved automatically.'))return;await api(`/api/projects/${id}/scenes/${index}/regenerate`,{method:'POST'});selected=id;refresh()}
async function useVariant(id,index,variantId){await api(`/api/projects/${id}/scenes/${index}/variants/${variantId}/select`,{method:'POST'});selected=id;refresh()}
async function approveProject(id){try{await api(`/api/projects/${id}/publish-approval`,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({decision:'approved'})});selected=id;refresh()}catch(e){alert('Approval blocked: '+e.message)}}
async function rejectProject(id){const note=prompt('Reason or requested changes (optional):','');if(note===null)return;await api(`/api/projects/${id}/publish-approval`,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({decision:'rejected',note})});selected=id;refresh()}
async function retryProject(id){await api(`/api/projects/${id}/retry`,{method:'POST'});selected=id;refresh()}
async function deleteProject(id){if(!confirm('Delete this project and all generated files? This cannot be undone.'))return;await api(`/api/projects/${id}`,{method:'DELETE'});if(selected===id)selected=null;detail.innerHTML='<div class="muted">Project deleted.</div>';refresh()}
async function poll(){await refresh();const busy=[...document.querySelectorAll('.project .muted')].some(x=>!/complete|failed/.test(x.textContent));setTimeout(poll,busy?3000:10000)}poll();
</script></body></html>
